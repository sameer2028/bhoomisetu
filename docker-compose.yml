# National Land Acquisition & Management System — SIH 2026
# Spatial database service (PostgreSQL 16 + PostGIS 3.4)
#
# Usage:
#   docker compose up -d        Start the spatial database
#   docker compose logs -f db   Follow database logs
#   docker compose down         Stop (data is preserved in the named volume)
#   docker compose down -v      Stop and DELETE all data

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nla_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: nla_db
      POSTGRES_USER: nla_user
      POSTGRES_PASSWORD: nla_dev_password
      # Deterministic collation so ORDER BY behaves the same everywhere
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - nla_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nla_user -d nla_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  nla_pgdata:
    name: nla_pgdata
